<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18191D"/>
      <stop offset="100%" stop-color="#0F1012"/>
    </linearGradient>
    <radialGradient id="pillGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#pillBg)"/>
  <rect width="800" height="500" fill="url(#pillGlow)"/>

  <!-- Desktop screen notch / island container -->
  <g transform="translate(200, 150)">
    <!-- Main expanded Dynamic Island shape -->
    <rect width="400" height="150" rx="42" fill="#000000" stroke="#333A44" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))"/>
    
    <!-- Island header -->
    <circle cx="50" cy="50" r="16" fill="#F59E0B" fill-opacity="0.2"/>
    <circle cx="50" cy="50" r="6" fill="#F59E0B"/>
    
    <text x="76" y="55" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Focus Timer</text>
    <text x="320" y="55" fill="#10B981" font-family="sans-serif" font-size="14" font-weight="bold">24:59</text>
    
    <!-- Waveform / Activity indicator -->
    <g transform="translate(50, 85)">
      <rect x="0" y="8" width="4" height="24" rx="2" fill="#3B82F6"/>
      <rect x="8" y="2" width="4" height="36" rx="2" fill="#60A5FA"/>
      <rect x="16" y="14" width="4" height="12" rx="2" fill="#3B82F6"/>
      <rect x="24" y="0" width="4" height="40" rx="2" fill="#93C5FD"/>
      <rect x="32" y="6" width="4" height="28" rx="2" fill="#60A5FA"/>
      <rect x="40" y="16" width="4" height="10" rx="2" fill="#3B82F6"/>
    </g>
    
    <text x="110" y="106" fill="#94A3B8" font-family="sans-serif" font-size="13">Rust &amp; Tauri v2 • Always on Top</text>
  </g>

  <text x="400" y="370" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="14" font-weight="500">Borderless Desktop Dynamic Island HUD</text>
</svg>
