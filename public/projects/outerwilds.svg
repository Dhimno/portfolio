<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#0B0F19"/>
  <rect width="800" height="500" fill="url(#spaceGlow)"/>

  <!-- Nomai spiral text and celestial orbital circles -->
  <g transform="translate(400, 230)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="40" fill="#F59E0B" fill-opacity="0.8"/>
    
    <!-- Orbiting planets -->
    <circle cx="90" cy="0" r="9" fill="#10B981"/>
    <circle cx="-140" cy="0" r="14" fill="#3B82F6"/>

    <!-- Nomai spiral curve aesthetic -->
    <path d="M-60,-60 Q0,-120 70,-40 T-30,50" fill="none" stroke="#93C5FD" stroke-width="2"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(200, 360)">
    <rect width="400" height="60" rx="10" fill="#131C2E" stroke="#2B3C5C" stroke-width="1"/>
    <text x="200" y="28" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Outer Wilds — Mod Bahasa Indonesia</text>
    <text x="200" y="46" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11">3.729 Baris Teks • Voice Matrix Karakter • Python Tkinter Installer</text>
  </g>
</svg>
