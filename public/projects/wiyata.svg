      <text x="16" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Lab Komputasi E101</text>
      <rect x="16" y="72" width="70" height="16" rx="4" fill="#3B82F6"/>
      <text x="24" y="84" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold">08:00 - 12:00</text>
    </g>
    
    <g transform="translate(368, 76)">
      <rect width="168" height="100" rx="10" fill="#22396B"/>
