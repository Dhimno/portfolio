      <text x="16" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Aula Prof. Soedarto</text>
      <rect x="16" y="72" width="60" height="16" rx="4" fill="url(#goldAccent)"/>
