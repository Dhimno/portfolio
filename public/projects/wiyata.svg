  </defs>
  <rect width="800" height="500" fill="url(#wiyataBg)"/>
  
  <!-- Subtle architectural grid lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Central Card Representation -->
  <g transform="translate(120, 90)">
    <rect width="560" height="320" rx="16" fill="#182A52" stroke="#2B4680" stroke-width="1.5"/>
    
