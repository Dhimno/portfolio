    <rect x="420" y="24" width="116" height="28" rx="6" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="1"/>
    <text x="440" y="42" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="600">Active Booking</text>
    
    <!-- Calendar slot mockups -->
    <g transform="translate(24, 76)">
      <rect width="160" height="100" rx="10" fill="#22396B"/>
