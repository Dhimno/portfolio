    <g transform="translate(24, 220)">
      <circle cx="16" cy="16" r="16" fill="#3B82F6" fill-opacity="0.2"/>
      <path d="M11 16 L15 20 L21 12" stroke="#60A5FA" stroke-width="2" fill="none"/>
      <text x="40" y="20" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="500">Real-time Conflict Checking &amp; Multi-role Approval</text>
